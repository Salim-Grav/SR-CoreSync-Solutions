<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;display=swap');

      .sr-serif-neon {
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        fill: #ffffff;
      }
      .sr-amp-neon {
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        fill: #facc15;
      }
      .brand-title-sr {
        font-family: 'Playfair Display', serif;
        font-weight: 900;
        font-size: 58px;
        fill: #ffffff;
      }
      .brand-title-sr-amp {
        fill: #facc15;
      }
      .brand-title-core {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -1px;
        fill: #ffffff;
      }
      .brand-sub-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 9px;
        fill: #facc15;
      }

      /* حركات الأيقونة والمدارات الدوارة */
      @keyframes orbitRotateSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes counterOrbitRotate {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes neonPulseGlow {
        0%, 100% {
          filter: drop-shadow(0 0 3px #ffffff) drop-shadow(0 0 10px #facc15) drop-shadow(0 0 25px rgba(245, 158, 11, 0.7));
          opacity: 1;
        }
        50% {
          filter: drop-shadow(0 0 1px #ffffff) drop-shadow(0 0 6px #eab308) drop-shadow(0 0 16px rgba(202, 138, 4, 0.45));
          opacity: 0.92;
        }
      }

      @keyframes starTwinkleGlint {
        0%, 100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
          filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 12px #fde047);
        }
        50% {
          transform: scale(1.4) rotate(45deg);
          opacity: 0.8;
          filter: drop-shadow(0 0 7px #ffffff) drop-shadow(0 0 20px #f59e0b) drop-shadow(0 0 35px #eab308);
        }
      }

      .animated-orbit-ring {
        transform-origin: 0 0;
        animation: orbitRotateSlow 28s linear infinite;
      }

      .animated-satellites {
        transform-origin: 0 0;
        animation: orbitRotateSlow 16s linear infinite;
      }

      .animated-ellipse-1 {
        transform-origin: 0 0;
        animation: orbitRotateSlow 40s linear infinite;
      }

      .animated-ellipse-2 {
        transform-origin: 0 0;
        animation: counterOrbitRotate 36s linear infinite;
      }

      .neon-glow-core {
        animation: neonPulseGlow 3.2s ease-in-out infinite;
      }

      .star-sparkle-center {
        transform-origin: 0 -45px;
        animation: starTwinkleGlint 2.4s ease-in-out infinite;
      }
    </style>

    <radialGradient id="neonOrbSphereLogo" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3d2700" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#1c1102" stop-opacity="0.98" />
      <stop offset="85%" stop-color="#080501" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="neonGoldTubeGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="neonNodeGradLogo" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <filter id="neonLogoBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="8" result="b2" />
      <feGaussianBlur stdDeviation="18" result="b3" />
      <feMerge>
        <feMergeNode in="b3" />
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeHaloFilterLogo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- القسم الأيسر: الرمز الكمي المضيء المتحرك -->
  <g transform="translate(170, 160)">
    <!-- هالة خافتة محيطية -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#facc15" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="5 7" />
    <circle cx="0" cy="0" r="135" fill="#eab308" fill-opacity="0.04" filter="url(#neonLogoBloom)" />

    <!-- المدارات التزامنية المائلة الدوارة -->
    <g class="animated-ellipse-1">
      <ellipse cx="0" cy="0" rx="124" ry="53" fill="none" stroke="#facc15" stroke-opacity="0.28" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="124" ry="53" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="10 120" />
    </g>

    <g class="animated-ellipse-2">
      <ellipse cx="0" cy="0" rx="53" ry="124" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="53" ry="124" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="10 120" />
    </g>

    <!-- الحلقة المدارية الخارجية الدقيقة مع الأقمار الدوارة -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="url(#neonGoldTubeGradLogo)" stroke-opacity="0.75" stroke-width="1.8" filter="url(#neonLogoBloom)" />
    
    <g class="animated-satellites">
      <g transform="rotate(0) translate(126, 0)">
        <circle cx="0" cy="0" r="11" fill="#facc15" fill-opacity="0.35" filter="url(#nodeHaloFilterLogo)" />
        <circle cx="0" cy="0" r="6" fill="url(#neonNodeGradLogo)" stroke="#ffffff" stroke-width="1.2" />
      </g>
      <g transform="rotate(180) translate(126, 0)">
        <circle cx="0" cy="0" r="11" fill="#facc15" fill-opacity="0.35" filter="url(#nodeHaloFilterLogo)" />
        <circle cx="0" cy="0" r="6" fill="url(#neonNodeGradLogo)" stroke="#ffffff" stroke-width="1.2" />
      </g>
    </g>

    <!-- الكرة المركزية -->
    <g class="neon-glow-core">
      <circle cx="0" cy="0" r="96" fill="url(#neonOrbSphereLogo)" stroke="#facc15" stroke-width="2.2" filter="url(#neonLogoBloom)" />
      <circle cx="0" cy="0" r="94" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.9" />
    </g>

    <!-- الحروف المركزية -->
    <g text-anchor="middle" dominant-baseline="central" class="neon-glow-core">
      <g filter="url(#neonLogoBloom)">
        <text x="-40" y="-2" font-size="82" class="sr-serif-neon" fill="#ffffff" stroke="#facc15" stroke-width="2">S</text>
        <text x="-4" y="6" font-size="42" class="sr-amp-neon" fill="#ffffff" stroke="#eab308" stroke-width="1.5">&amp;</text>
        <text x="36" y="-2" font-size="82" class="sr-serif-neon" fill="#ffffff" stroke="#facc15" stroke-width="2">R</text>
      </g>
      <text x="-40" y="-2" font-size="82" class="sr-serif-neon" fill="#ffffff">S</text>
      <text x="-4" y="6" font-size="42" class="sr-amp-neon" fill="#facc15">&amp;</text>
      <text x="36" y="-2" font-size="82" class="sr-serif-neon" fill="#ffffff">R</text>
    </g>

    <!-- النجمة النيونية المشعة المتلألئة -->
    <g class="star-sparkle-center">
      <path d="M 0,-56 L 2.6,-48 L 9.8,-47.5 L 4.4,-42.5 L 6.2,-35.5 L 0,-39.5 L -6.2,-35.5 L -4.4,-42.5 L -9.8,-47.5 L -2.6,-48 Z" 
            fill="#ffffff" stroke="#facc15" stroke-width="1.2" filter="url(#neonLogoBloom)" />
    </g>
  </g>

  <!-- القسم الأيمن: التيبوغرافيا النيونية الملكية الكاملة -->
  <g transform="translate(365, 0)">
    <!-- السطر الأول: S&R CoreSync بالوهج والنبض الذهبي -->
    <g transform="translate(0, 150)" class="neon-glow-core">
      <g filter="url(#neonLogoBloom)">
        <text x="0" y="0" class="brand-title-sr" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.6">S<tspan class="brand-title-sr-amp">&amp;</tspan>R</text>
        <text x="145" y="0" class="brand-title-core" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.6">CoreSync</text>
      </g>
      <text x="0" y="0" class="brand-title-sr">S<tspan class="brand-title-sr-amp">&amp;</tspan>R</text>
      <text x="145" y="0" class="brand-title-core">CoreSync</text>
    </g>

    <!-- خط الفصل النيوني المضيء -->
    <line x1="0" y1="182" x2="520" y2="182" stroke="url(#neonGoldTubeGradLogo)" stroke-width="2" stroke-linecap="round" filter="url(#neonLogoBloom)" />

    <!-- السطر الثاني: SOLUTIONS مع نجوم التألق -->
    <g transform="translate(0, 222)">
      <text x="5" y="0" class="brand-sub-title" filter="url(#neonLogoBloom)" stroke="#d97706" stroke-width="1.5">SOLUTIONS</text>
      <text x="5" y="0" class="brand-sub-title">SOLUTIONS</text>
      <!-- نجمة بريق صغيرة مكملة للتصميم -->
      <g transform="translate(480, -6)" class="star-sparkle-center">
        <path d="M 0,-10 L 2,-3 L 7,-3 L 3,1 L 4.5,6 L 0,3 L -4.5,6 L -3,1 L -7,-3 L -2,-3 Z" fill="#ffffff" stroke="#facc15" stroke-width="0.8" filter="url(#neonLogoBloom)"/>
      </g>
    </g>
  </g>
</svg>
