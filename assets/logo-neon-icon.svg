<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&amp;display=swap');
      
      .sr-serif-neon {
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        fill: #ffffff;
      }
      .sr-amp-neon {
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        fill: #facc15;
      }

      /* حركات ومؤثرات الشعار النيوني الذهبي الملكي */
      @keyframes orbitRotateSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes counterOrbitRotate {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes neonTubePulse {
        0%, 100% {
          filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 12px #facc15) drop-shadow(0 0 30px rgba(245, 158, 11, 0.7));
          opacity: 1;
        }
        50% {
          filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 7px #eab308) drop-shadow(0 0 18px rgba(202, 138, 4, 0.45));
          opacity: 0.92;
        }
      }

      @keyframes starTwinkleGlint {
        0%, 100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
          filter: drop-shadow(0 0 3px #ffffff) drop-shadow(0 0 10px #fde047);
        }
        50% {
          transform: scale(1.35) rotate(45deg);
          opacity: 0.82;
          filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 18px #f59e0b) drop-shadow(0 0 32px #eab308);
        }
      }

      @keyframes dashFlow {
        from { stroke-dashoffset: 800; }
        to { stroke-dashoffset: 0; }
      }

      .animated-orbit-ring {
        transform-origin: 0 0;
        animation: orbitRotateSlow 28s linear infinite;
      }

      .animated-satellites {
        transform-origin: 0 0;
        animation: orbitRotateSlow 16s linear infinite;
      }

      .animated-ellipse-1 {
        transform-origin: 0 0;
        animation: orbitRotateSlow 40s linear infinite;
      }

      .animated-ellipse-2 {
        transform-origin: 0 0;
        animation: counterOrbitRotate 36s linear infinite;
      }

      .neon-glow-core {
        animation: neonTubePulse 3.2s ease-in-out infinite;
      }

      .star-sparkle-center {
        transform-origin: 0 -72px;
        animation: starTwinkleGlint 2.4s ease-in-out infinite;
      }
    </style>

    <!-- تدرجات الإضاءة النيونية الذهبية والكهربائية الفاخرة -->
    <radialGradient id="neonOrbSphere" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3d2700" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#1c1102" stop-opacity="0.98" />
      <stop offset="85%" stop-color="#080501" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="neonGoldTubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="neonNodeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <!-- فيلاتر التوهج النيوني العميق -->
    <filter id="neonIconBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="8" result="b2" />
      <feGaussianBlur stdDeviation="20" result="b3" />
      <feMerge>
        <feMergeNode in="b3" />
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeHaloFilter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(250, 250)">
    <!-- هالة توهج محيطية خارجية -->
    <circle cx="0" cy="0" r="235" fill="none" stroke="#facc15" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="0" cy="0" r="218" fill="#eab308" fill-opacity="0.04" filter="url(#neonIconBloom)" />

    <!-- المدارات التزامنية المائلة الدوارة (Kinetic Ellipses) -->
    <g class="animated-ellipse-1">
      <ellipse cx="0" cy="0" rx="196" ry="84" fill="none" stroke="#facc15" stroke-opacity="0.25" stroke-width="1.8" />
      <ellipse cx="0" cy="0" rx="196" ry="84" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="14 180" />
    </g>

    <g class="animated-ellipse-2">
      <ellipse cx="0" cy="0" rx="84" ry="196" fill="none" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="1.8" />
      <ellipse cx="0" cy="0" rx="84" ry="196" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="14 180" />
    </g>

    <!-- الحلقة المدارية الخارجية الدقيقة مع الأقمار الدوارة -->
    <circle cx="0" cy="0" r="198" fill="none" stroke="url(#neonGoldTubeGrad)" stroke-opacity="0.75" stroke-width="2.2" filter="url(#neonIconBloom)" />
    
    <!-- الأقمار الصناعية الدوارة في المدار الخارجي (Satellites) -->
    <g class="animated-satellites">
      <g transform="rotate(0) translate(198, 0)">
        <circle cx="0" cy="0" r="16" fill="#facc15" fill-opacity="0.35" filter="url(#nodeHaloFilter)" />
        <circle cx="0" cy="0" r="9" fill="url(#neonNodeGrad)" stroke="#ffffff" stroke-width="1.5" />
      </g>
      <g transform="rotate(180) translate(198, 0)">
        <circle cx="0" cy="0" r="16" fill="#facc15" fill-opacity="0.35" filter="url(#nodeHaloFilter)" />
        <circle cx="0" cy="0" r="9" fill="url(#neonNodeGrad)" stroke="#ffffff" stroke-width="1.5" />
      </g>
    </g>

    <!-- الكرة المركزية النيونية الداكنة الفاخرة ذات الإطار الذهبي المتوهج -->
    <g class="neon-glow-core">
      <circle cx="0" cy="0" r="152" fill="url(#neonOrbSphere)" stroke="#facc15" stroke-width="3" filter="url(#neonIconBloom)" />
      <circle cx="0" cy="0" r="150" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9" />
      <circle cx="0" cy="0" r="142" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1" />
    </g>

    <!-- حروف S&R بالوهج النيوني الذهبي المشع -->
    <g text-anchor="middle" dominant-baseline="central" class="neon-glow-core">
      <!-- طبقة الظل والتشتت النيوني للحروف -->
      <g filter="url(#neonIconBloom)">
        <text x="-64" y="-3" font-size="132" class="sr-serif-neon" fill="#ffffff" stroke="#facc15" stroke-width="3">S</text>
        <text x="-7" y="10" font-size="65" class="sr-amp-neon" fill="#ffffff" stroke="#eab308" stroke-width="2">&amp;</text>
        <text x="58" y="-3" font-size="132" class="sr-serif-neon" fill="#ffffff" stroke="#facc15" stroke-width="3">R</text>
      </g>
      <!-- الطبقة الناصعة فوق التشتت لضمان الحدة الفائقة -->
      <text x="-64" y="-3" font-size="132" class="sr-serif-neon" fill="#ffffff">S</text>
      <text x="-7" y="10" font-size="65" class="sr-amp-neon" fill="#facc15">&amp;</text>
      <text x="58" y="-3" font-size="132" class="sr-serif-neon" fill="#ffffff">R</text>
    </g>

    <!-- النجمة النيونية الذهبية المتلألئة في أعلى تاج الرمز (مثل نجمة دانا نجمة) -->
    <g class="star-sparkle-center">
      <path d="M 0,-85 L 3.8,-74.5 L 14,-74 L 6.2,-67.5 L 8.8,-57.5 L 0,-63 L -8.8,-57.5 L -6.2,-67.5 L -14,-74 L -3.8,-74.5 Z" 
            fill="#ffffff" stroke="#facc15" stroke-width="1.8" filter="url(#neonIconBloom)" />
      <line x1="0" y1="-95" x2="0" y2="-45" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
      <line x1="-25" y1="-70" x2="25" y2="-70" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>
</svg>
