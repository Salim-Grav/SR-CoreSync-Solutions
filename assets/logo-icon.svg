<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&amp;display=swap');
      .sr-serif {
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        fill: #ffffff;
      }
      .sr-amp {
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        fill: #38bdf8;
      }
    </style>

    <radialGradient id="orbGlowIcon" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#034975" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#02213d" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="orbBorderGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="nodeGlowIcon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <filter id="softGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeDropGlowIcon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- الرمز الأيقوني المستقل بدون خلفية داكنة إجبارية لاستخدامه في كل المقاسات -->
  <g transform="translate(250, 250)">
    <!-- هالة خلفية خافتة -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5" />
    <circle cx="0" cy="0" r="215" fill="#0284c7" fill-opacity="0.06" filter="url(#softGlowIcon)" />

    <!-- الحلقة المدارية الخارجية الدقيقة -->
    <circle cx="0" cy="0" r="198" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.8" />

    <!-- عقد المدار المتزامنة -->
    <g transform="rotate(-35) translate(198, 0)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.25" filter="url(#nodeDropGlowIcon)" />
      <circle cx="0" cy="0" r="8.5" fill="url(#nodeGlowIcon)" stroke="#bae6fd" stroke-width="1" />
    </g>
    <g transform="rotate(145) translate(198, 0)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.25" filter="url(#nodeDropGlowIcon)" />
      <circle cx="0" cy="0" r="8.5" fill="url(#nodeGlowIcon)" stroke="#bae6fd" stroke-width="1" />
    </g>

    <!-- مدارات التزامن الثنائية المائلة -->
    <ellipse cx="0" cy="0" rx="194" ry="83" transform="rotate(35)" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="194" ry="83" transform="rotate(-35)" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" />

    <!-- الكرة الزرقاء المركزية المضيئة -->
    <circle cx="0" cy="0" r="152" fill="url(#orbGlowIcon)" stroke="url(#orbBorderGradIcon)" stroke-width="2.8" />
    <circle cx="0" cy="0" r="141" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

    <!-- الحروف والشعار -->
    <g text-anchor="middle" dominant-baseline="central">
      <text x="-64" y="-3" font-size="132" class="sr-serif">S</text>
      <text x="-7" y="10" font-size="65" class="sr-amp">&amp;</text>
      <text x="58" y="-3" font-size="132" class="sr-serif">R</text>
    </g>
  </g>
</svg>
